name: prompthon-track-guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: read
  pull-requests: write

# Avoid simultaneous label reconciliation for the same PR.
concurrency:
  group: pr-classification-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prompthon-track-guard:
    name: prompthon-track-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Classify contribution and validate changed paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/prompthon-track-guard.mjs
