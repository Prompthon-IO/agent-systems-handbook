name: Bug Or Broken Surface Report
description: Report a broken link, factual problem, example bug, template problem, or repository workflow issue.
title: "[Bug]: "
labels: ["status: pending-review", "track: builder", "kind: bug"]
body:
  - type: dropdown
    id: contribution_track
    attributes:
      label: Contribution track
      description: Bug reports are builder-track work in v0.
      options:
        - builder
    validations:
      required: true
  - type: dropdown
    id: work_kind
    attributes:
      label: Work kind
      description: "Bug reports use the `kind: bug` label."
      options:
        - bug
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Skill Compass score proposal

        Propose how this issue should split Vision, Harness, and Craft points.
        Use integers only. The total of all three values must be between 1 and
        100. A collaborator may adjust these values before approving the issue.
  - type: input
    id: vision_score
    attributes:
      label: Vision score
      description: Discovery, framing, strategy, research, synthesis, or editorial judgment.
      value: "10"
    validations:
      required: true
  - type: input
    id: harness_score
    attributes:
      label: Harness score
      description: Applying workflows, tools, templates, systems, or existing repo patterns.
      value: "45"
    validations:
      required: true
  - type: input
    id: craft_score
    attributes:
      label: Craft score
      description: Building, writing, coding, polishing, testing, or improving the final artifact.
      value: "45"
    validations:
      required: true
  - type: dropdown
    id: bug_type
    attributes:
      label: Problem type
      options:
        - Broken link or navigation path
        - Factual or editorial error
        - Example project bug
        - Issue or PR template problem
        - Repository workflow or automation problem
        - Other concrete repository defect
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected path or URL
      description: Point to the exact repo path, page, or workflow where the problem appears.
      placeholder: systems/README.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or content
      placeholder: The page should link to...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or content
      placeholder: The link currently resolves to...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce or verify
      description: Include the concrete steps, commands, or navigation path.
      placeholder: 1. Open ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, proposed fixes, or related issue links if useful.
